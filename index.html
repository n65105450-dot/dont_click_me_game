<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Don't Catch Me</title>
    <link rel="icon" type="image/x-icon" href="images/favicon.png">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">
        <!-- START SCREEN -->
        <div id="startScreen">
            <h1>😂 DON'T CATCH ME! 😂</h1>
            <p>Can you catch me? 😈</p>
            <div class="rules">
                <p>⏱️ You have 30 seconds</p>
                <p>🏆 Get the highest score</p>
                <p>🎁 Win a funny gift</p>
            </div>
            <button id="startButton">🎮 START GAME</button>
        </div>

        <!-- GAME WORLD -->
        <div id="gameWorld">

            <!-- BACKGROUND ELEMENTS -->
            <div class="particles"></div>

            <div class="bubbles">
                <span></span>
                <span></span>
                <span></span>
                <span></span>
            </div>

            <img src="images/jellyfish.png" class="realJelly jelly1" alt="Glowing jellyfish">
            <img src="images/jellyfish.png" class="realJelly jelly2" alt="Glowing jellyfish">
            <img src="images\jelly2.png" class="realJelly jelly3" alt="Glowing jellyfish">
            <img src="images\jelly2.png" class="realJelly jelly4" alt="glowing jellyfish">

            <img src="https://static.vecteezy.com/system/resources/thumbnails/047/814/140/small_2x/colorful-watercolor-underwater-world-with-corals-and-marine-life-isolated-on-a-transparent-background-png.png"
                class="coral coralLeft" alt="corals">
            <img src="images\coral_right..png" class="coral coralRight" alt="corals">

            <!-- UI ELEMENTS -->
            <div class="uiContainer">

                <!-- TOP LEFT SCORE BOARD -->
                <div class="scoreBoard">
                    <div class="boardIcon">🏆</div>
                    <div class="boardLabel">SCORE</div>
                    <div class="boardValue" id="score">0</div>
                </div>

                <!-- TOP CENTER TITLE -->
                <div class="topTitle">
                    <h1>Don't Catch Me</h1>
                    <p>Catch the fish if you can 😈</p>
                </div>

                <!-- TOP RIGHT TIMER BOARD -->
                <div class="timerBoard">
                    <div class="boardIcon">⏱</div>
                    <div class="boardLabel">TIME</div>
                    <div class="boardValue"><span id="timer">30</span>s</div>
                </div>

            </div>

            <!-- MAIN FISH WITH SPEECH BUBBLE -->
            <div class="mainFishContainer" id="mainFishArea">
                <div class="fishSpeechBubble">
                    <span class="bubbleText">Catch me if you can! 😈</span>
                    <div class="bubbleTail"></div>
                </div>
                <img id="runButton" src="images\magical_fish.png" alt="Catch me">
            </div>

            <!-- DECORATIVE FUNNY FISH AT BOTTOM -->
            <div class="funnyFishContainer">
                <div class="funnyFishSpeechBubble">
                    <div class="funnyBubbleText" id="funnyMessage">Let's play! 😂</div>
                    <div class="funnyBubbleTail"></div>
                </div>
                <img src="images\cartoon-fish-big-smile.png" class="funnyFish" alt="Funny Fish">
                  <h2 id="message"></h2>

            </div>

            <!-- GAME MESSAGE -->
       

        </div>

        <!-- GIFT -->
        <div id="giftArea">
            <img id="mainGift"
                src="https://png.pngtree.com/png-clipart/20231017/ourmid/pngtree-happy-birthday-balls-with-gift-box-png-image_10218456.png"
                alt="Gift">
        </div>

        <!-- REWARD POPUP -->
        <div id="rewardPopup">
            <div class="rewardBox">
                <h1>🎉 YOUR GIFT! 🎉</h1>
                <img id="rewardImage" src="" alt="Your reward">
                <h2 id="rewardMessage"></h2>
                <button id="playAgain">🔄 Play Again</button>
            </div>
        </div>

    </div>

    <script src="script.js"></script>
</body>

</html>
